<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .sheet { display: flex; justify-content: center; padding: 20px 0; }
  svg { display: block; }
</style>
</head>
<body>
<div class="sheet">
<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#fdfdfb"/>

  <!-- 标题 -->
  <text x="450" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a">魔法小夜灯 · 光控 LED 电路</text>

  <!-- 图例 -->
  <g font-size="12.5" fill="#333">
    <line x1="250" y1="52" x2="286" y2="52" stroke="#d32f2f" stroke-width="3"/><text x="292" y="56">＋4.5V</text>
    <line x1="360" y1="52" x2="396" y2="52" stroke="#1565c0" stroke-width="3"/><text x="402" y="56">GND</text>
    <line x1="470" y1="52" x2="506" y2="52" stroke="#2e7d32" stroke-width="2.5"/><text x="512" y="56">控制信号（节点X → 基极）</text>
  </g>

  <!-- 顶部 VCC 轨 -->
  <line x1="60" y1="90" x2="840" y2="90" stroke="#d32f2f" stroke-width="4"/>
  <text x="60" y="80" font-size="13" fill="#d32f2f" font-weight="600">＋4.5V（3×AA，接 ＋ 轨）</text>

  <!-- 底部 GND 轨 -->
  <line x1="60" y1="450" x2="840" y2="450" stroke="#1565c0" stroke-width="4"/>
  <text x="60" y="476" font-size="13" fill="#1565c0" font-weight="600">GND（接 − 轨）</text>

  <!-- ① 分压支路 -->
  <g>
    <text x="235" y="120" font-size="14" font-weight="700" fill="#1a1a1a">① 分压器</text>
    <line x1="280" y1="90" x2="280" y2="132" stroke="#d32f2f" stroke-width="2.5"/>
    <rect x="260" y="132" width="40" height="20" fill="#e8cfa6" stroke="#8d6e63" stroke-width="1.5"/>
    <text x="308" y="147" font-size="12" fill="#5d4037">47kΩ</text>
    <line x1="280" y1="152" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <circle cx="280" cy="205" r="5" fill="#2e7d32"/>
    <text x="292" y="210" font-size="13" font-weight="700" fill="#2e7d32">X</text>
    <!-- LDR -->
    <rect x="262" y="220" width="36" height="40" fill="#dbe4ee" stroke="#5c6bc0" stroke-width="1.5"/>
    <line x1="280" y1="205" x2="280" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="342" y1="226" x2="324" y2="236" stroke="#5c6bc0" stroke-width="1.8"/>
    <line x1="342" y1="252" x2="324" y2="242" stroke="#5c6bc0" stroke-width="1.8"/>
    <text x="348" y="266" font-size="12" fill="#333">LDR（光敏电阻）</text>
    <line x1="280" y1="300" x2="280" y2="330" stroke="#1565c0" stroke-width="2"/>
    <line x1="245" y1="330" x2="315" y2="330" stroke="#1565c0" stroke-width="2"/>
    <line x1="255" y1="340" x2="305" y2="340" stroke="#1565c0" stroke-width="2"/>
    <line x1="267" y1="350" x2="293" y2="350" stroke="#1565c0" stroke-width="2"/>
  </g>

  <!-- 节点 X → 基极 控制线 -->
  <path d="M 280 205 L 440 205 L 440 300 L 470 300" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- ② 三极管 -->
  <g>
    <circle cx="500" cy="300" r="28" fill="#fff" stroke="#37474f" stroke-width="2"/>
    <line x1="500" y1="280" x2="500" y2="320" stroke="#37474f" stroke-width="2.5"/>
    <!-- 基极 B -->
    <line x1="472" y1="300" x2="500" y2="300" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="455" y="293" font-size="12" font-weight="700" fill="#333">B</text>
    <!-- 集电极 C -->
    <line x1="500" y1="280" x2="500" y2="272" stroke="#ef6c00" stroke-width="2.5"/>
    <text x="510" y="268" font-size="12" font-weight="700" fill="#333">C</text>
    <!-- 发射极 E -->
    <line x1="500" y1="320" x2="500" y2="330" stroke="#1565c0" stroke-width="2.5"/>
    <path d="M 500 324 L 508 332 L 492 332 Z" fill="#1565c0"/>
    <text x="510" y="348" font-size="12" font-weight="700" fill="#333">E</text>
    <text x="540" y="315" font-size="15" font-weight="700" fill="#333">2N3904</text>
    <text x="540" y="332" font-size="10.5" fill="#777">NPN</text>
    <!-- 发射极接地 -->
    <line x1="500" y1="332" x2="500" y2="372" stroke="#1565c0" stroke-width="2"/>
    <line x1="468" y1="372" x2="532" y2="372" stroke="#1565c0" stroke-width="2"/>
    <line x1="478" y1="382" x2="522" y2="382" stroke="#1565c0" stroke-width="2"/>
    <line x1="490" y1="392" x2="510" y2="392" stroke="#1565c0" stroke-width="2"/>
  </g>

  <!-- 2N3904 引脚顺序（TO-92） -->
  <g>
    <text x="660" y="200" font-size="14" font-weight="700" fill="#1a1a1a">2N3904 引脚（有字面朝自己）</text>
    <path d="M 660 250 Q 700 205 740 250 Z" fill="#e0e0e0" stroke="#37474f" stroke-width="1.5"/>
    <text x="700" y="245" font-size="12" font-weight="700" fill="#333" text-anchor="middle">2N3904</text>
    <line x1="672" y1="250" x2="672" y2="298" stroke="#37474f" stroke-width="2"/>
    <line x1="700" y1="250" x2="700" y2="298" stroke="#37474f" stroke-width="2"/>
    <line x1="728" y1="250" x2="728" y2="298" stroke="#37474f" stroke-width="2"/>
    <text x="672" y="315" font-size="13" font-weight="700" fill="#1565c0" text-anchor="middle">E</text>
    <text x="700" y="315" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">B</text>
    <text x="728" y="315" font-size="13" font-weight="700" fill="#ef6c00" text-anchor="middle">C</text>
    <text x="700" y="340" font-size="11" fill="#555" text-anchor="middle">从左到右 E-B-C：E 接 GND，B 接 X，C 接 LED</text>
  </g>

  <!-- ③ LED 支路 -->
  <g>
    <text x="600" y="120" font-size="14" font-weight="700" fill="#1a1a1a">③ 灯（LED）</text>
    <line x1="500" y1="90" x2="500" y2="132" stroke="#d32f2f" stroke-width="2.5"/>
    <rect x="480" y="132" width="40" height="20" fill="#e8cfa6" stroke="#8d6e63" stroke-width="1.5"/>
    <text x="528" y="147" font-size="12" fill="#5d4037">220Ω</text>
    <line x1="500" y1="152" x2="500" y2="190" stroke="#d32f2f" stroke-width="2"/>
    <!-- LED 符号：阳极上、阴极下 -->
    <polygon points="480,245 520,245 500,192" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2"/>
    <line x1="472" y1="245" x2="528" y2="245" stroke="#d32f2f" stroke-width="2.5"/>
    <line x1="500" y1="204" x2="520" y2="204" stroke="#d32f2f" stroke-width="1.6"/>
    <line x1="500" y1="224" x2="520" y2="224" stroke="#d32f2f" stroke-width="1.6"/>
    <text x="530" y="222" font-size="12" fill="#333">LED</text>
    <text x="534" y="238" font-size="10.5" fill="#777">长脚＋</text>
    <!-- LED 阴极 → 集电极 -->
    <line x1="500" y1="245" x2="500" y2="272" stroke="#ef6c00" stroke-width="2.5"/>
  </g>

  <!-- 提示 -->
  <text x="60" y="430" font-size="12.5" fill="#555">节点 X 要同时连三样：47kΩ、光敏电阻、三极管基极 B（插在面包板同一列）。</text>
</svg>
</div>
</body>
</html>
